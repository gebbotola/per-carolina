<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso</title>

  <!-- CSS globale (stesso della Home) -->
  <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/improvements.css">
</head>

<body class="index">
    <a class="skip-link" href="#main-content">Vai al contenuto</a>

  <div role="main" id="main-content" tabindex="-1" class="lock-container">
    <h1>Inserisci il codice</h1>

    <div id="display" class="display" aria-hidden="true">&#9675; &#9675; &#9675; &#9675; &#9675; &#9675;</div><p class="sr-only" id="codeStatus" role="status"></p>

    <div class="keypad">
      <button onclick="press(1)">1</button>
      <button onclick="press(2)">2</button>
      <button onclick="press(3)">3</button>

      <button onclick="press(4)">4</button>
      <button onclick="press(5)">5</button>
      <button onclick="press(6)">6</button>

      <button onclick="press(7)">7</button>
      <button onclick="press(8)">8</button>
      <button onclick="press(9)">9</button>

      <button onclick="backspaceCode()" aria-label="Cancella ultima cifra">⌫</button>
      <button onclick="press(0)">0</button>
      <button onclick="clearCode()">C</button>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const correctCode = "060925";
    let inputCode = "";

    function press(number) {
      if (inputCode.length >= 6) return;

      inputCode += number;
      updateDisplay();

      if (inputCode.length === 6) {
        checkCode();
      }
    }

    function updateDisplay() {
      const display = document.getElementById("display");
      let dots = "";

      for (let i = 0; i < 6; i++) {
        dots += i < inputCode.length ? "● " : "○ ";
      }

      display.textContent = dots.trim();
      document.getElementById("codeStatus").textContent = inputCode.length + " cifre inserite su 6";
    }

    function clearCode() {
      inputCode = "";
      updateDisplay();
    }

    function checkCode() {
      const display = document.getElementById("display");

      if (inputCode === correctCode) {
        window.location.href = "home.html";
      } else {
        display.classList.add("error");
        setTimeout(() => display.classList.remove("error"), 400);
        clearCode();
        document.getElementById("codeStatus").textContent = "Codice non corretto. Riprova.";
      }
    }
    function backspaceCode() { inputCode = inputCode.slice(0, -1); updateDisplay(); }
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey) return;
      if (/^[0-9]$/.test(event.key)) { event.preventDefault(); press(Number(event.key)); }
      else if (event.key === 'Backspace') { event.preventDefault(); backspaceCode(); }
      else if (event.key === 'Escape') { clearCode(); }
    });
  </script>

</body>

</html>

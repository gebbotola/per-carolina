<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi</title>

    <!-- CSS HOME -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- CSS GIOCHI -->
    <link rel="stylesheet" href="../css/giochi.css">
    <link rel="stylesheet" href="../css/improvements.css">
</head>

<body class="no-hearts">
    <a class="skip-link" href="#main-content">Vai al contenuto</a>
    <div role="main" id="main-content" tabindex="-1" class="games-wrapper">

        <h1 class="page-title">Giochi</h1>

        <!-- MENU GIOCHI -->
        <div class="games-menu">
            <button id="trisTab" aria-pressed="false" aria-controls="trisGame" onclick="showTris()">Tris</button>
            <button id="memoryTab" aria-pressed="false" aria-controls="memoryGame" onclick="showMemory()">Memory</button>
        </div>

        <!-- AREA GIOCHI (centrata) -->
        <div class="games-area">

            <!-- TRIS -->
            <div id="trisGame" class="game-box hidden">

                <div class="selectors">
                    <select aria-label="ModalitÃ  del Tris" id="mode" onchange="resetTris()">
                        <option value="duo">❤️ vs ⭐</option>
                        <option value="pc">❤️ vs 🤖 PC</option>
                    </select>

                    <select aria-label="DifficoltÃ  del computer" id="difficulty" onchange="resetTris()">
                        <option value="easy">Facile</option>
                        <option value="medium">Media</option>
                        <option value="hard">Difficile</option>
                    </select>
                </div>

                <div class="score">
                    <div>❤️ <span id="scoreH">0</span></div>
                    <div>⭐ <span id="scoreS">0</span></div>
                </div>

                <div class="status" id="trisStatus" role="status">Tocca a ❤️</div>
                <div class="board" id="trisBoard"></div>

                <div class="actions">
                    <button onclick="resetTris()">Ricomincia</button>
                    <button onclick="resetScore()">Azzera punteggi</button>
                </div>
            </div>

            <!-- MEMORY -->
            <div id="memoryGame" class="game-box hidden">
                <div id="memoryStatus" role="status" class="status">Trova tutte le coppie.</div>
                <div class="memory-board" id="memoryBoard"></div>
                <button onclick="startMemory()">Ricomincia</button>
            </div>

        </div>

        <a class="back" href="../home.html">← Torna alla home</a>
    </div>

    <!-- JS IDENTICO -->
    <script src="../js/games.js"></script>
</body>

</html>
